[package]
name = "agent-ffi"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-backend-desktop = { version = "0.1.0", path = "../agent-backend-desktop" }
agent-core = { version = "0.1.0", path = "../agent-core" }
agent-llm-anthropic = { version = "0.1.0", path = "../agent-llm-anthropic" }
agent-store-fs = { version = "0.1.0", path = "../agent-store-fs" }
async-trait = "0.1.91"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[lib]
name = "pocketmac_agent"
crate-type = ["cdylib", "staticlib", "rlib"]
