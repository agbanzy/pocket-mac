name: PocketMac
options:
  bundleIdPrefix: com.innoedge
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  PocketMacKit:
    path: ../shared/PocketMacKit

targets:
  PocketMacApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PocketMac
    dependencies:
      - package: PocketMacKit
        product: PocketMacKit
    settings:
      base:
        PRODUCT_NAME: PocketMac
        PRODUCT_BUNDLE_IDENTIFIER: com.innoedge.pocketmac
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PocketMac/Resources/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app ships under the Innoedge team (JB94NKM5A6) — that is the team that owns
        # com.innoedge.pocketmac on App Store Connect and holds the distribution certificate. It was
        # previously pointed at the personal team 7T7BJT2AU7, which archives could only resolve while
        # an Xcode account happened to be signed in; when that lapsed, every archive failed with
        # "No Account for Team". Releases now go through scripts/ship-ios.sh, which archives unsigned
        # and signs offline, so shipping does not depend on Xcode's account state at all.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JB94NKM5A6
        CODE_SIGN_IDENTITY: "Apple Development"
      configs:
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_IDENTITY: ""

schemes:
  PocketMacApp:
    build:
      targets:
        PocketMacApp: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
